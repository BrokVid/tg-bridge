name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# cooldown: never run more than one release build per tag/ref;
# a re-pushed tag cancels the stale build instead of queueing behind it
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: tg-bridge-x86_64-linux-musl.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build static binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          cd "target/${{ matrix.target }}/release"
          tar czf "../../../${{ matrix.artifact }}" tg-bridge
          sha256sum "../../../${{ matrix.artifact }}" > "../../../${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
