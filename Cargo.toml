[package]
name = "tg-bridge"
version = "0.1.0"
edition = "2021"
description = "Self-hosted HMAC-authenticated relay to the Telegram Bot API"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
hmac = "0.13"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
